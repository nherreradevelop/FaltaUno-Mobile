# Integración continua (Plan de calidad - SQA):
# en cada pull request y push a develop/main se ejecutan el análisis estático,
# el formato, la verificación de tipos y las pruebas. Si alguna etapa falla, no se puede hacer merge.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Mobile - lint, formato y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Verificar tipos
        if: hashFiles('app.json') != ''
        run: npx tsc --noEmit
      - run: npm test --if-present
